name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        # The Pages build only needs the Vite renderer — electron's own
        # ~100MB browser binary download is irrelevant here and just slows
        # the job down.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v4

      # upload-pages-artifact never overwrites a same-named artifact, so a
      # "Re-run failed jobs" on this same run would otherwise leave the prior
      # attempt's "github-pages" artifact in place — deploy-pages then finds
      # two artifacts and hard-fails with "Multiple artifacts... found".
      # Clearing any leftover before uploading keeps retries idempotent.
      - name: Remove stale github-pages artifact from a previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.artifacts[].id')
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
